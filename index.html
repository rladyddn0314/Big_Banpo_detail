<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>반포1동 민간도심복합개발사업 세부 구역도</title>
<meta name="description" content="반포1동 민간도심복합개발사업 세부 구역도 - 필지별 세부블럭 및 용도지역 조회">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --ink:#1b1f24; --muted:#6b7280;
    --accent:#c62828; --shadow:0 3px 16px rgba(15,23,42,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
  @supports (height:100dvh){ html,body{height:100dvh} }
  #app{display:flex;flex-direction:column;height:100%}

  header{background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;z-index:1200;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  h1{font-size:18px;margin:0;font-weight:750;letter-spacing:-.4px}
  h1 span{color:var(--accent)}
  .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

  #main{flex:1;position:relative;min-height:0}
  #map{position:absolute;inset:0}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:1000}
  #ctrl{top:12px;left:12px;padding:13px;width:252px}
  #ctrl h3{margin:0 0 7px;font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;font-weight:700}
  #ctrl h3:not(:first-child){margin-top:13px}
  #ctrlMore h3:first-child{margin-top:13px}

  .ctrlTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ctrlTop h3{margin:0}
  .toggleBtn{display:none;border:1px solid var(--line);background:#f6f7f9;color:var(--muted);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;align-items:center;gap:4px;white-space:nowrap}
  .toggleBtn .chev{transition:transform .15s;display:inline-block}
  #ctrl.open .toggleBtn .chev{transform:rotate(180deg)}

  .searchwrap{position:relative}
  .searchrow{display:flex;gap:6px}
  #q{flex:1;min-width:0;padding:10px 12px;border:1.5px solid #d6dae0;border-radius:9px;font-size:14px;outline:none;transition:.15s;font-family:inherit}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(198,40,40,.10)}
  #go{padding:10px 14px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  #go:hover{background:#a71d1d}
  .hint{font-size:11px;color:var(--muted);margin-top:5px}
  #sug{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);max-height:250px;overflow:auto;display:none;z-index:1300}
  #sug div{padding:8px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #f1f3f5}
  #sug div:last-child{border-bottom:0}
  #sug div:hover{background:#fdecec}
  #sug small{color:var(--muted);margin-left:6px}

  .seg{display:flex;background:#f1f3f5;border-radius:8px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:9px;cursor:pointer;user-select:none}
  .chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

  #legend{bottom:22px;left:12px;padding:11px 13px;width:252px;display:none;max-height:52vh;display:none;flex-direction:column}
  #legend.show{display:flex}
  #lgBody{overflow:auto;min-height:0}
  #lgBody.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
  #lgBody.grid .lg{gap:5px;padding:3px 3px;font-size:11.5px}
  #lgBody.grid .lg .nm{flex:none}
  #legend .lghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:8px}
  #legend h3{margin:0;font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;font-weight:700}
  #lgAll{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;color:var(--muted);font-family:inherit;font-weight:600}
  #lgAll:hover{background:#f4f6f8;color:var(--ink)}
  .lghdBtns{display:flex;align-items:center;gap:6px;flex:none}
  #lgClose{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:14px;line-height:1;padding:3px 8px;cursor:pointer;color:var(--muted);font-family:inherit}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 4px;border-radius:6px;cursor:pointer;user-select:none}
  .lg:hover{background:#f4f6f8}
  .lg input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex:none;margin:0}
  .lg.off{opacity:.42}
  .lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg .ct{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .sw{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.22);flex:none}
  .lghint{font-size:10.5px;color:var(--muted);margin-top:6px;padding-left:2px}

  #lgOpenFab{display:none;position:absolute;left:12px;bottom:22px;z-index:999;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:10px 18px;border-radius:24px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;align-items:center;gap:6px}

  #banner{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:1100;background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:11px;box-shadow:var(--shadow);padding:12px 34px 12px 18px;display:none;max-width:min(520px,86vw)}
  #banner .big{font-size:16.5px;font-weight:750;letter-spacing:-.3px}
  #banner .big b{color:var(--accent);font-size:19px}
  #banner .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  #banner .x{position:absolute;top:6px;right:9px;border:0;background:none;font-size:17px;color:#b6bcc4;cursor:pointer;line-height:1;font-family:inherit}
  #banner.err{border-left-color:#9aa1a9}
  #banner.err .big b{color:#6b7280}

  .lbl{font-size:11.5px;font-weight:800;color:#12245c;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%)}
  .leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.55}
  .leaflet-popup-content .pt{font-size:15px;font-weight:750;margin-bottom:5px}
  .leaflet-popup-content table{border-collapse:collapse;margin-top:3px}
  .leaflet-popup-content td{padding:1.5px 0;vertical-align:top}
  .leaflet-popup-content td:first-child{color:var(--muted);padding-right:12px;white-space:nowrap}
  .pill{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;padding:1.5px 9px;font-size:12px;font-weight:700}

  @media (max-width:760px){
    header{padding:9px 12px}
    h1{font-size:15px} .sub{display:none}
    #ctrl{width:calc(100vw - 16px);top:8px;left:8px;padding:11px;max-height:calc(100% - 16px);overflow:auto}
    #legend{width:calc(100vw - 16px);bottom:12px;left:8px;max-height:44vh;transition:transform .18s ease}
    #banner{top:auto;bottom:14px;max-width:calc(100vw - 16px)}

    #q{font-size:16px}
    .toggleBtn{display:flex}
    #ctrlMore{display:none}
    #ctrl.open #ctrlMore{display:block}

    #legend:not(.open){transform:translateY(calc(100% + 26px));pointer-events:none}
    #legend.open{pointer-events:auto}
    #lgClose{display:inline-block}
    #lgOpenFab{display:flex}
    #legend.open ~ #lgOpenFab{display:none}
  }
</style>
</head>

/* ---------- 초기 상태 (기본값) ---------- */
let mode = 'bl';        // 세부블럭
let baseKey = 'gray';   // 밝은 회색
let showLabels = true;  // 블록 번호 ON
let showOutline = false;// 블록 경계 OFF

/* ---------- 색상 ---------- */
function blockColor(n){
  n = parseInt(n,10);
  const h = (n*137.508) % 360;
  const s = 58 + ((n*37)%3)*9;
  const l = 56 + ((n*53)%3)*7;
  return `hsl(${h.toFixed(1)},${s}%,${l}%)`;
}
const UZ_ORDER = ['제1종일반주거지역','제2종일반주거지역(7층이하)','제2종일반주거지역','제3종일반주거지역','준주거지역','일반상업지역'];
const UZ_COLOR = {
  '제1종일반주거지역':'#fff7bc','제2종일반주거지역(7층이하)':'#fde078','제2종일반주거지역':'#fac43c',
  '제3종일반주거지역':'#f39237','준주거지역':'#e86842','일반상업지역':'#e24a80'
};
const NONE_COLOR = '#dfe3e8';
const NONE_KEY = '__none__';
const UZ_NONE = NONE_KEY;
const uzOn = new Set([...UZ_ORDER, NONE_KEY]);          // 용도지역 표시 여부
const blOn = new Set();                                  // 세부블럭 표시 여부 (아래에서 채움)
function uzKey(p){ return p.uz || NONE_KEY; }
function blKey(p){ return p.bl || NONE_KEY; }
function isVisible(p){ return mode==='uz' ? uzOn.has(uzKey(p)) : blOn.has(blKey(p)); }
const BL_COUNT = (()=>{ const c={}; DATA.features.forEach(f=>{ const k=f.properties.bl||NONE_KEY; c[k]=(c[k]||0)+1; }); return c; })();
const BL_ITEMS = [...Object.keys(BLOCKS).sort((x,y)=>x-y), NONE_KEY].filter(b=>BL_COUNT[b]);
BL_ITEMS.forEach(b=>blOn.add(b));   // 기본: 전부 켜짐

/* ---------- 지도 ---------- */
const map = L.map('map',{zoomControl:true,minZoom:14,maxZoom:20,preferCanvas:true});
const bases = {
  gray: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom:20,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}),
  osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'&copy; OpenStreetMap contributors'})
};
let curBase = bases[baseKey].addTo(map);

/* ---------- 필지 ---------- */
function fillOf(p){
  if(mode==='bl') return p.bl ? blockColor(p.bl) : NONE_COLOR;
  return p.uz ? (UZ_COLOR[p.uz]||'#cfd4da') : NONE_COLOR;
}
const HIDDEN_STYLE = {fillOpacity:0, opacity:0, weight:0, fillColor:'#000', color:'#000'};
function styleOf(f){
  const p=f.properties;
  if(!isVisible(p)) return HIDDEN_STYLE;
  return {fillColor:fillOf(p), fillOpacity:(p.bl||p.uz)?0.72:0.45, color:'#6b7280', weight:0.45, opacity:.75};
}
const layer = L.geoJSON(DATA,{
  style:styleOf,
  onEachFeature:(f,l)=>{ l.on('click',()=>{ if(isVisible(f.properties)) selectFeature(f,l,false); }); }
}).addTo(map);
map.fitBounds(layer.getBounds(),{padding:[18,18]});

const blockOutline = L.geoJSON(DATA,{
  filter:f=>!!f.properties.bl,
  style:f=>({color:'#b71c1c',weight:1.6,opacity:isVisible(f.properties)?.9:0,fill:false}),
  interactive:false
});

/* ---------- 블록 라벨 ("28구역") ---------- */
const labelLayer = L.layerGroup();
const blockLabel = {};
Object.keys(BLOCKS).sort((a,b)=>a-b).forEach(b=>{
  blockLabel[b] = L.marker(BLOCKS[b].c,{interactive:false,
    icon:L.divIcon({className:'',html:`<div class="lbl">${b}구역</div>`,iconSize:[0,0]})
  });
});

/* ---------- 인덱스 ---------- */
const byJibun = {};
layer.eachLayer(l=>{ const p=l.feature.properties; if(p.jb) byJibun[p.jb.replace(/\s+/g,'')] = l; });
const jibunList = Object.keys(byJibun).sort((a,b)=>{
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return (pa[0]-pb[0]) || ((pa[1]||0)-(pb[1]||0));
});

/* ---------- 선택 ---------- */
let hi = null;
function fmt(n){ return (n||0).toLocaleString('ko-KR'); }
function popupHtml(p){
  const blk = p.bl ? `<span class="pill">${p.bl}구역</span>` : '<span style="color:#6b7280">세부블럭 미지정</span>';
  return `<div class="pt">반포동 ${p.jb} ${blk}</div>
  <table>
    <tr><td>지목</td><td>${p.jm||'-'}</td></tr>
    <tr><td>면적</td><td>${fmt(p.ar)}㎡ (${fmt(p.py)}평)</td></tr>
    <tr><td>용도지역</td><td>${p.uz||'-'}</td></tr>
    <tr><td>토지이용</td><td>${p.lu||'-'}</td></tr>
    <tr><td>공시지가</td><td>${p.pr?fmt(p.pr)+'원/㎡':'-'}</td></tr>
  </table>`;
}
function selectFeature(f,l,zoom){
  const p=f.properties;
  if(hi) layer.resetStyle(hi);
  hi=l;
  l.setStyle({color:'#111',weight:3,opacity:1,fillOpacity:.9});
  l.bringToFront();
  if(zoom) map.fitBounds(l.getBounds(),{maxZoom:19,padding:[70,70]});
  L.popup({maxWidth:300}).setLatLng(l.getBounds().getCenter()).setContent(popupHtml(p)).openOn(map);
  showBanner(p);
}
function showBanner(p){
  const el=document.getElementById('banner');
  el.classList.remove('err');
  if(p.bl){
    document.getElementById('bTxt').innerHTML = `당신의 필지는 <b>${p.bl}구역</b>입니다.`;
    document.getElementById('bMeta').textContent =
      `반포동 ${p.jb} · ${p.jm||'-'} · ${fmt(p.ar)}㎡(${fmt(p.py)}평) · ${p.uz||'용도지역 미지정'}`;
  }else{
    el.classList.add('err');
    document.getElementById('bTxt').innerHTML = `반포동 ${p.jb} 는 <b>세부블럭 미지정</b> 필지입니다.`;
    document.getElementById('bMeta').textContent = `${p.jm||''} 등 도로·공공용지는 구역 번호가 부여되지 않았습니다.`;
  }
  el.style.display='block';
}
function bannerMsg(t,m){
  const el=document.getElementById('banner');
  el.classList.add('err');
  document.getElementById('bTxt').innerHTML=t;
  document.getElementById('bMeta').textContent=m||'';
  el.style.display='block';
}
function hideBanner(){ document.getElementById('banner').style.display='none'; }

/* ---------- 검색 ---------- */
const q=document.getElementById('q'), sug=document.getElementById('sug');
function norm(s){ return (s||'').replace(/\s+/g,'').replace(/[번지]/g,'').replace(/[–—−]/g,'-'); }
function renderSug(hits){
  sug.innerHTML = hits.slice(0,60).map(j=>{
    const p=byJibun[j].feature.properties;
    return `<div data-j="${j}">반포동 ${j}<small>${p.bl?p.bl+'구역':'미지정'}</small></div>`;
  }).join('');
  sug.style.display='block';
  [...sug.children].forEach(d=>d.onclick=()=>{
    const l=byJibun[d.dataset.j]; q.value=d.dataset.j; sug.style.display='none'; selectFeature(l.feature,l,true);
  });
}
function doSearch(v){
  const k=norm(v); if(!k) return;
  if(byJibun[k]){ const l=byJibun[k]; selectFeature(l.feature,l,true); sug.style.display='none'; return; }
  const hits=jibunList.filter(j=>j.startsWith(k));
  if(hits.length===1){ const l=byJibun[hits[0]]; selectFeature(l.feature,l,true); sug.style.display='none'; return; }
  if(hits.length>1){ renderSug(hits); return; }
  sug.style.display='none';
  bannerMsg(`<b>반포동 ${v}</b> 필지를 찾을 수 없습니다.`,'사업구역 밖이거나 지번 표기가 다를 수 있습니다. 예) 714-26');
}
q.addEventListener('input',()=>{
  const k=norm(q.value);
  if(k.length<2){ sug.style.display='none'; return; }
  const hits=jibunList.filter(j=>j.startsWith(k));
  if(hits.length && !(hits.length===1&&hits[0]===k)) renderSug(hits); else sug.style.display='none';
});
q.addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(q.value); if(e.key==='Escape') sug.style.display='none'; });
document.getElementById('go').onclick=()=>doSearch(q.value);
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) sug.style.display='none'; });

/* ---------- 컨트롤 ---------- */
function applyLabels(){
  labelLayer.clearLayers();
  if(showLabels){
    Object.keys(blockLabel).forEach(b=>{ if(mode!=='bl' || blOn.has(b)) labelLayer.addLayer(blockLabel[b]); });
    if(!map.hasLayer(labelLayer)) labelLayer.addTo(map);
  }else if(map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
}
function applyOutline(){
  if(showOutline && !map.hasLayer(blockOutline)) blockOutline.addTo(map);
  if(!showOutline && map.hasLayer(blockOutline)) map.removeLayer(blockOutline);
}
const UZ_COUNT = (()=>{ const c={}; DATA.features.forEach(f=>{ const k=f.properties.uz||NONE_KEY; c[k]=(c[k]||0)+1; }); return c; })();
const UZ_ITEMS = [...UZ_ORDER.filter(u=>UZ_COUNT[u]), NONE_KEY].filter(u=>UZ_COUNT[u]);

function curSet(){ return mode==='uz' ? uzOn : blOn; }
function curItems(){ return mode==='uz' ? UZ_ITEMS : BL_ITEMS; }

function refreshView(){
  layer.setStyle(styleOf);
  if(map.hasLayer(blockOutline)) blockOutline.setStyle(f=>({color:'#b71c1c',weight:1.6,opacity:isVisible(f.properties)?.9:0,fill:false}));
  applyLabels();
  if(hi){
    if(isVisible(hi.feature.properties)) hi.setStyle({color:'#111',weight:3,opacity:1,fillOpacity:.9});
    else { map.closePopup(); hideBanner(); hi=null; }
  }
  const set=curSet();
  document.querySelectorAll('#lgBody .lg').forEach(d=>{
    const on=set.has(d.dataset.k);
    d.classList.toggle('off',!on);
    const cb=d.querySelector('input'); if(cb) cb.checked=on;
  });
  const btn=document.getElementById('lgAll');
  if(btn) btn.textContent = set.size ? '모두 끄기' : '모두 켜기';
}

function applyLegend(){
  const el=document.getElementById('legend');
  const body=document.getElementById('lgBody');
  const set=curSet(), items=curItems();
  document.getElementById('lgTitle').textContent = mode==='uz' ? '범례 · 세부 용도지역' : '범례 · 세부블럭';
  document.getElementById('lgHint').textContent = mode==='uz'
    ? '체크를 해제하면 지도에서 숨겨집니다'
    : '구역명을 클릭하면 그 구역으로 이동합니다';
  body.className = mode==='bl' ? 'grid' : '';
  body.innerHTML = items.map(k=>{
    const isNone = k===NONE_KEY;
    let nm, col, ct;
    if(mode==='uz'){ nm = isNone?'미지정 (도로 등)':k; col = isNone?NONE_COLOR:UZ_COLOR[k]; ct = UZ_COUNT[k]; }
    else { nm = isNone?'미지정':k+'구역'; col = isNone?NONE_COLOR:blockColor(k); ct = BL_COUNT[k]; }
    return `<label class="lg" data-k="${k}" title="${nm} · 필지 ${ct}개">
      <input type="checkbox" ${set.has(k)?'checked':''}>
      <span class="sw" style="background:${col}"></span>
      <span class="nm">${nm}</span>
      ${mode==='uz'?`<span class="ct">${ct}</span>`:''}
    </label>`;
  }).join('');

  body.querySelectorAll('.lg input').forEach(cb=>{
    cb.onchange = e=>{
      const k = e.target.closest('.lg').dataset.k;
      e.target.checked ? set.add(k) : set.delete(k);
      refreshView();
    };
  });
  if(mode==='bl'){
    body.querySelectorAll('.lg .nm').forEach(nm=>{
      nm.onclick = e=>{
        e.preventDefault();
        const k = e.target.closest('.lg').dataset.k;
        if(BLOCKS[k]){ map.fitBounds(BLOCKS[k].b,{padding:[50,50]}); bannerMsg(`<b>${k}구역</b>`, `필지 ${BL_COUNT[k]}개`); }
      };
    });
  }
  document.getElementById('lgAll').onclick = ()=>{
    if(set.size) set.clear(); else items.forEach(k=>set.add(k));
    applyLegend(); refreshView();
  };
  el.classList.add('show');
  refreshView();
}

document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  mode=b.dataset.m;
  applyLegend();
};
document.getElementById('baseSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  map.removeLayer(curBase); baseKey=b.dataset.b; curBase=bases[baseKey].addTo(map); curBase.bringToBack();
};
document.getElementById('cLbl').onchange=e=>{ showLabels=e.target.checked; applyLabels(); };
document.getElementById('cOut').onchange=e=>{ showOutline=e.target.checked; applyOutline(); refreshView(); };

/* ---------- 기본값 반영 ---------- */
document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
document.querySelectorAll('#baseSeg button').forEach(b=>b.classList.toggle('on', b.dataset.b===baseKey));
document.getElementById('cLbl').checked = showLabels;
document.getElementById('cOut').checked = showOutline;
applyOutline(); applyLegend();

L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

/* ---------- 모바일: 설정/범례 패널 접기·펼치기 & 지도 크기 보정 ---------- */
const ctrlToggle = document.getElementById('ctrlToggle');
if(ctrlToggle){
  ctrlToggle.onclick = ()=>{
    const open = document.getElementById('ctrl').classList.toggle('open');
    ctrlToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
}
const lgClose = document.getElementById('lgClose');
const lgOpenFab = document.getElementById('lgOpenFab');
if(lgClose) lgClose.onclick = ()=> document.getElementById('legend').classList.remove('open');
if(lgOpenFab) lgOpenFab.onclick = ()=> document.getElementById('legend').classList.add('open');

/* 모바일 초기 렌더 시 지도 컨테이너 크기가 늦게 잡히는 경우를 대비해 크기 재계산 */
function fixMapSize(){ map.invalidateSize(); }
window.addEventListener('resize', fixMapSize);
window.addEventListener('orientationchange', ()=>setTimeout(fixMapSize,250));
